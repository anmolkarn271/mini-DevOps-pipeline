```yaml
name: Mini DevOps CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: mini-devops-pipeline
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --file "${DOCKERFILE_PATH}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA::7}" \
            .

      - name: Start Container
        run: |
          docker run -d \
            --name mini-devops-test \
            -p 3000:3000 \
            "${IMAGE_NAME}:${GITHUB_SHA::7}"

      - name: Wait for Application
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to become healthy"
          docker logs mini-devops-test
          exit 1

      - name: Verify Health Response
        run: |
          response=$(curl --fail --silent http://localhost:3000/api/health)
          echo "$response"

          node -e '
            const data = JSON.parse(process.argv[1]);

            if (
              data.status !== "healthy" ||
              data.application !== "mini-devops-pipeline"
            ) {
              console.error("Health check validation failed");
              process.exit(1);
            }

            console.log("Health response validated successfully");
          ' "$response"

      - name: Cleanup Test Container
        if: always()
        run: |
          docker rm -f mini-devops-test || true

  publish:
    name: Publish Image to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Image Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mini-devops-pipeline
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
```
